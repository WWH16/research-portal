version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  # Routine minor and patch updates arrive monthly in one pull request per ecosystem; major versions stay separate.
  # Security advisories for the PHP and JavaScript packages open pull requests too.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
